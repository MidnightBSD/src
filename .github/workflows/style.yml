name: Style Checker

# Runs my simple style(9) checker on pull requests.

on:
  pull_request: # maybe pull_request_target
    branches: [ master ]
    types: [ opened, reopened, edited, synchronize ]
    paths: [ '**.S', '**.c', '**.cc', '**.cpp', '**.h', '**.hh', '**.hpp' ]

permissions:
  contents: read

jobs:
  build:
    name: Style Checker
    runs-on: ubuntu-latest
    steps:
      # Unfortunately there doesn't seem to be a way to
      # do this without an extra step.
      - name: Get depth
        run: |
          echo "DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> $GITHUB_ENV
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ env.DEPTH }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install packages
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install perl
      # Check the combined diff of the pull request rather than each commit:
      # paths are then tree-relative (so vendor code is skipped) and line
      # numbers match the head tree, which is what the annotations need.
      # --github emits GitHub Actions annotations for each finding and the
      # script exits non-zero when any ERROR is reported, which fails the job.
      - name: Run checker
        run: |
          sha=$(git rev-parse HEAD~${{ github.event.pull_request.commits }})
          git diff ${sha} ${{ github.event.pull_request.head.sha }} |
              tools/build/checkstyle9.pl --github --patch -
