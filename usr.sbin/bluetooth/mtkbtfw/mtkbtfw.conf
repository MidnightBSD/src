#
# Download MediaTek MT79xx bluetooth adaptor firmware
#
# Keep in sync with mtkbt_list[] in main.c and ubt_mtk_devs[] in
# sys/netgraph/bluetooth/drivers/ubt/ng_ubt_mtk.c.
#

# MT7920
notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"ATTACH";
	match "vendor"		"0x0489";
	match "product"		"(0xe134|0xe135|0xe158)";
	action "/usr/sbin/mtkbtfw -d $cdev -f /usr/local/share/mtkbt-firmware";
};

